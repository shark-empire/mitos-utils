[package]
name = "mitos-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["shark-empire"]
description = "Coreutils-style userspace utilities for mitosOS, plus the shared terminal/shell IPC contract"
license = "MIT"
repository = "https://github.com/shark-empire/mitos-utils"

[lib]
name = "mitos_utils"
path = "src/lib.rs"

# NOTE: anything you drop into src/bin/ is auto-detected by Cargo as a
# standalone binary (e.g. src/bin/ipc-ping.rs) — no extra config needed.

# The ~50 applets and common/ are zero-dependency by design (see
# docs/architecture.md). Everything below exists solely for src/ipc.rs
# (terminal/shell IPC -- not one of the 50 utilities), which
# deliberately uses two encodings for its two transports: serde_json
# for MROP (embedded in a terminal escape sequence, must stay
# text-safe) and bincode for the raw-socket IPC framing (no text-safety
# need, so it gets the smaller/faster binary encoding instead -- matches
# mitos-service's wire format). The fuzz/ workspace is the only other
# zero-dependency exception, and it's isolated from this package
# entirely (see fuzz/Cargo.toml).
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1.38", features = ["net", "io-util"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }

[profile.release]
strip = true      # drop debug symbols -- matters with ~50+ shipped binaries
lto = true
codegen-units = 1
