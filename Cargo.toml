[package]
name = "mitos-utils"
version = "0.1.0"
edition = "2021"
authors = ["shark-empire"]
description = "Shared contracts, MROP protocol, and IPC plumbing for the MITOS ecosystem"
license = "MIT"
repository = "https://github.com/shark-empire/mitos-utils"

[lib]
name = "mitos_utils"
path = "src/lib.rs"

# NOTE: anything you drop into src/bin/ is auto-detected by Cargo as a
# standalone binary (e.g. src/bin/ipc-ping.rs) — no extra config needed.

[dependencies]
# Serialization for IpcRequest / IpcResponse / RichWidget
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Unix Domain Socket framing (ipc_send / ipc_recv over UnixStream)
tokio = { version = "1.38", features = ["net", "io-util"] }

# ── Optional: uncomment as src/common or src/applets grow ──────────────
# dirs = "5.0"          # XDG home/config discovery
# notify = "6.1"        # filesystem watching (theme/config hot-reload)
# chrono = "0.4"        # timestamps for logs & execution blocks
# thiserror = "1.0"     # ergonomic shared error types

[dev-dependencies]
# Full runtime + test utilities for integration tests of the IPC framing
tokio = { version = "1.38", features = ["full", "test-util"] }
