name: mitos-utils CI

# Deliberately Linux-only (ubuntu-latest, no OS matrix): mitos-utils is
# "developed/tested against Linux" per docs/architecture.md, and most
# of the privileged applets (mount, umount, dmesg, ...) are gated
# behind cfg(target_os = "linux") anyway, so a macOS/Windows leg would
# either no-op or just fail to link.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────── cargo fmt ──────────────────────────
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ────────────────────────── cargo clippy ──────────────────────────
  # Restores the "clippy" step docs/architecture.md and README.md both
  # describe for this pipeline but the checked-in ci.yml didn't
  # actually have.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets covers the lib, all ~50 applet binaries,
      # mitos-box, and the tests/ integration tests.
      - run: cargo clippy --all-targets -- -D warnings

  # ────────────────────────── cargo build ──────────────────────────
  build:
    name: Build (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --verbose

  # ────────────────────────── MSRV check ──────────────────────────
  # chown.rs / chgrp.rs call OsStr::as_encoded_bytes(), stabilized in
  # Rust 1.74 -- Cargo.toml pins rust-version = "1.74" for exactly
  # this reason. This job keeps that pin honest against a real
  # toolchain instead of just trusting the manifest.
  msrv:
    name: MSRV (1.74.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo build --all-targets --verbose

  # ────────────────────────── cargo test ──────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not --all-targets here on purpose: plain `cargo test` also runs
      # doc-tests, on top of unit tests and the tests/*.rs integration
      # suite (81 #[test] fns as of this writing). None of those shell
      # out to mount/umount/kill/dmesg for real, so this needs no
      # elevated privileges on the runner.
      - run: cargo test --verbose

  # ────────────────────────── rustdoc ──────────────────────────
  # docs/integration.md exists specifically so other MITOS crates can
  # depend on this one as a library -- keep the actual rustdoc output
  # (broken intra-doc links, etc.) held to the same bar.
  docs:
    name: Docs (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

  # ────────────────────────── fuzz targets still compile ──────────────────────────
  # fuzz/ is its own isolated Cargo workspace ([workspace] members =
  # ["."] in fuzz/Cargo.toml), so none of the jobs above ever touch it
  # -- confirmed: `cargo build`/`test` from the repo root never sees
  # fuzz/Cargo.toml. This job doesn't actually fuzz (that's
  # scripts/run_fuzz.sh, for local/manual runs) -- it's a cheap check
  # that the 4 targets still compile against the real applet APIs
  # instead of silently bit-rotting.
  fuzz-build:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - working-directory: fuzz
        run: cargo check

  # ────────────────────────── security audit ──────────────────────────
  # No Cargo.lock is checked in yet, so this generates one to audit
  # against. The dependency surface is small on purpose -- just
  # ipc.rs's serde/serde_json/tokio -- but "small" isn't "zero", and a
  # "general public" build should still have it vetted.
  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo generate-lockfile
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # ────────────────────────── binary size budget ──────────────────────────
  # Cargo.toml now sets strip/lto/codegen-units=1 under
  # [profile.release], so these should land well under the numbers
  # below -- still kept generous since this hasn't had a real run
  # yet. Once you see actual sizes in this job's log, tighten them.
  binary-size:
    name: Binary size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bins --verbose
      - name: Check binary sizes
        run: |
          set -e
          DEFAULT_BUDGET=$((2 * 1024 * 1024))    # 2 MiB, per single-applet binary
          MITOS_BOX_BUDGET=$((8 * 1024 * 1024))  # 8 MiB, bundles all ~50 applets
          fail=0
          for bin in target/release/*; do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            name=$(basename "$bin")
            size=$(stat -c%s "$bin")
            if [ "$name" = "mitos-box" ]; then budget=$MITOS_BOX_BUDGET; else budget=$DEFAULT_BUDGET; fi
            printf '%-14s %10d bytes (budget %d)\n' "$name" "$size" "$budget"
            if [ "$size" -gt "$budget" ]; then
              echo "::error::$name is $size bytes, over its $budget byte budget"
              fail=1
            fi
          done
          exit $fail
